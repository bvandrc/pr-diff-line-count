name: PR Diff Line Count
description: Count the code lines a pull request's diff actually changes, with comments, blank lines, tests, and generated files apart.
author: bvandrc

branding:
  icon: git-pull-request
  color: purple

inputs:
  github-token:
    description: "Token used to post the comment. Needs `pull-requests: write`."
    default: ${{ github.token }}
  comment:
    description: Post the table as a sticky pull request comment.
    default: 'true'
  color-counts:
    description: Color the counts by the kind of change. Needs them set as LaTeX, the one thing GitHub colors; `false` leaves them plain, for where the `markdown` output goes to a renderer that does no LaTeX.
    default: 'true'
  base-sha:
    description: Revision to count from. Defaults to the pull request's base; the merge base of the two is what actually gets counted.
    default: ''
  head-sha:
    description: Revision to count to. Defaults to the pull request's head.
    default: ''

outputs:
  markdown:
    description: The rendered table, for posting somewhere else.
  json:
    description: Every count, as `{byCategory,total}` -- see the README.

runs:
  using: node24
  main: dist/index.cjs

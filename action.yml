name: PR Diff Line Count
description: Count the code lines a pull request's diff actually changes, with comments, blank lines, tests, and generated files apart.
author: bvandrc

branding:
  icon: git-pull-request
  color: purple

inputs:
  github-token:
    description: "Token used to post the comment. Needs `pull-requests: write`."
    default: ${{ github.token }}
  comment:
    description: Post the table as a sticky pull request comment.
    default: 'true'
  color-counts:
    description: Color the counts by the kind of change. Needs them set as LaTeX, the one thing GitHub colors; `false` leaves them plain, for when LaTeX output is not desired.
    default: 'true'
  base-sha:
    description: Revision to count from. Defaults to the pull request's base; the merge base of the two is what actually gets counted.
    default: ''
  head-sha:
    description: Revision to count to. Defaults to the pull request's head.
    default: ''

  tests-patterns:
    description: |
      Globs deciding what counts as tests (`**/*.test.*`, `**/__tests__/**`, `**/test_*.py`, ...), replacing the built-in list outright. One glob per line -- a comma is never a separator, since a brace glob contains one. Leave unset to keep the built-in list.
    default: ''
  extra-tests-patterns:
    description: |
      Globs added to whichever tests list is in force. Prefix a glob with `!` to drop the paths it matches back out of the category. One glob per line.
    default: ''

  generated-patterns:
    description: |
      Globs deciding what counts as generated (lockfiles, `**/dist/**`, `**/*.pb.go`, ...), replacing the built-in list outright. One glob per line -- a comma is never a separator, since a brace glob contains one. Leave unset to keep the built-in list.
    default: ''
  extra-generated-patterns:
    description: |
      Globs added to whichever generated list is in force. Prefix a glob with `!` to drop the paths it matches back out of the category. One glob per line.
    default: ''

  docs-patterns:
    description: |
      Globs deciding what counts as docs (`**/*.md`, `**/docs/**`, `LICENSE*`, ...), replacing the built-in list outright. One glob per line -- a comma is never a separator, since a brace glob contains one. Leave unset to keep the built-in list.
    default: ''
  extra-docs-patterns:
    description: |
      Globs added to whichever docs list is in force. Prefix a glob with `!` to drop the paths it matches back out of the category. One glob per line.
    default: ''

  config-patterns:
    description: |
      Globs deciding what counts as config (`**/*.json`, `**/.github/**`, `**/Dockerfile*`, ...), replacing the built-in list outright. One glob per line -- a comma is never a separator, since a brace glob contains one. Leave unset to keep the built-in list.
    default: ''
  extra-config-patterns:
    description: |
      Globs added to whichever config list is in force. Prefix a glob with `!` to drop the paths it matches back out of the category. One glob per line.
    default: ''

outputs:
  markdown:
    description: The rendered table, for posting somewhere else.
  json:
    description: Every count, as `{byCategory,total}` -- see the README.

runs:
  using: node24
  main: dist/index.cjs

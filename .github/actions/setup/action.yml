name: Setup
description: Install Node and the project's dependencies.

runs:
  using: composite

  steps:
    # Before setup-node, whose pnpm cache asks pnpm where its store lives.
    # The version comes from package.json's `packageManager`.
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'pnpm'

    # No node_modules cache: pnpm links the tree from its store rather than
    # unpacking tarballs into it, so a warm store installs in a second or two
    # and a cached tree would save nothing worth the chance of it disagreeing
    # with the lockfile.
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
